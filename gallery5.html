<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری تصاویر (بخش پنجم) | پریسا زارع</title>
    <style>
        :root {
            --bg-color: #fcf9f2;
            --card-bg: #ffffff;
            --gold-color: #c9a45c;
            --navy-color: #1a2235;
            --text-dark: #111827;
            --text-gray: #6b7280;
        }

        body {
            font-family: 'Tahoma', 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }

        .main-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        .gallery-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .gallery-card {
            background-color: var(--card-bg);
            border: 2px solid var(--gold-color);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .image-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- تنظیمات مربوط به عکس و بزرگنمایی (لایت باکس) --- */
        .image-wrapper img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
            display: block;
            cursor: pointer; /* تغییر شکل موس به دست برای نشان دادن قابلیت کلیک */
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .image-wrapper img:hover {
            filter: brightness(0.9); /* کمی تیره شدن موقع هاور */
        }

        /* لایه پس‌زمینه تیره (مودال) */
        .lightbox {
            display: none; /* در حالت عادی مخفی است */
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* پس‌زمینه مشکی نیمه شفاف */
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* زمانی که کلاس active اضافه شود، نمایش داده می‌شود */
        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        /* تصویر داخل لایت باکس */
        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox.active img {
            transform: scale(1);
        }

        /* دکمه بستن (ضربدر) */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--gold-color);
        }

        /* --- بقیه استایل‌ها --- */
        .card-info {
            padding-top: 20px;
            text-align: right;
        }

        .image-caption {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 10px;
        }

        .album-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-dark);
            margin: 0;
        }

        .back-to-menu-container {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .back-to-menu-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--navy-color);
            border: 2px solid var(--navy-color);
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-family: inherit;
            cursor: pointer;
        }

        .back-to-menu-btn:hover {
            background-color: var(--navy-color);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(26, 34, 53, 0.3);
        }

        @media (max-width: 600px) {
            .gallery-card { padding: 10px; }
            .album-title { font-size: 18px; }
            .main-title { font-size: 20px; }
            .back-to-menu-btn { padding: 10px 20px; font-size: 14px; width: 80%; }
            .close-btn { top: 10px; right: 20px; font-size: 35px; }
        }
    </style>
</head>
<body>

    <h1 class="main-title">گالری تصاویر (بخش پنجم)</h1>

    <div class="gallery-container">
        <!-- کارت عکس اول -->
        <div class="gallery-card">
            <div class="image-wrapper">
                <!-- اضافه شدن onclick برای باز کردن لایت باکس -->
                <img src="IMG_۲۰۲۶۱۱۰۳_۰۰۱۷۴۴.jpg" alt="تصویر شماره یک" loading="lazy" onclick="openLightbox(this.src)">
            </div>
            <div class="card-info">
                <div class="image-caption">تصویر شماره یک (جدید)</div>
                <h2 class="album-title">آلبوم جدید ۱</h2>
            </div>
        </div>

        <!-- کارت عکس دوم -->
        <div class="gallery-card">
            <div class="image-wrapper">
                <img src="IMG_۲۰۲۶۱۱۰۳_۰۰۱۸۴۴.jpg" alt="تصویر شماره دو" loading="lazy" onclick="openLightbox(this.src)">
            </div>
            <div class="card-info">
                <div class="image-caption">تصویر شماره دو (جدید)</div>
                <h2 class="album-title">آلبوم جدید ۲</h2>
            </div>
        </div>

        <!-- کارت عکس سوم -->
        <div class="gallery-card">
            <div class="image-wrapper">
                <img src="IMG_۲۰۲۶۱۱۰۳_۰۰۱۸۱۶.jpg" alt="تصویر شماره سه" loading="lazy" onclick="openLightbox(this.src)">
            </div>
            <div class="card-info">
                <div class="image-caption">تصویر شماره سه (جدید)</div>
                <h2 class="album-title">آلبوم جدید ۳</h2>
            </div>
        </div>

        <!-- کارت عکس چهارم -->
        <div class="gallery-card">
            <div class="image-wrapper">
                <img src="IMG_۲۰۲۶۱۱۰۳_۰۰۱۹۱۵.jpg" alt="تصویر شماره چهار" loading="lazy" onclick="openLightbox(this.src)">
            </div>
            <div class="card-info">
                <div class="image-caption">تصویر شماره چهار (جدید)</div>
                <h2 class="album-title">آلبوم جدید ۴</h2>
            </div>
        </div>
    </div>

    <!-- دکمه بازگشت به منو -->
    <div class="back-to-menu-container">
        <a href="menu.html" class="back-to-menu-btn">بازگشت به منو</a>
    </div>

    <!-- ساختار لایت باکس در انتهای صفحه -->
    <div id="imageLightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightboxImg" src="" alt="تصویر بزرگ">
    </div>

    <!-- کدهای جاوا اسکریپت برای عملکرد لایت باکس -->
    <script>
        const lightbox = document.getElementById('imageLightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        // تابع باز کردن عکس
        function openLightbox(imageSrc) {
            lightboxImg.src = imageSrc;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // جلوگیری از اسکرول صفحه هنگام باز بودن عکس
        }

        // تابع بستن عکس
        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto'; // برگرداندن اسکرول
        }

        // جلوگیری از بسته شدن وقتی روی خود عکس کلیک می‌شود
        lightboxImg.onclick = function(event) {
            event.stopPropagation();
        }
    </script>

</body>
        </html>
