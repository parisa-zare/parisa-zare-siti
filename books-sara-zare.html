<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- جلوگیری از کش شدن -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>کتاب‌های دکتر سارا زارع کاریزک | عضو هیئت علمی دانشگاه خلیج فارس</title>
  <meta name="description" content="گالری کتاب‌ها و آثار خانم دکتر سارا زارع کاریزک، عضو هیئت علمی دانشگاه خلیج فارس.">

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      line-height: 1.7;
      padding: 20px;
    }

    .top-nav {
      max-width: 1200px;
      margin: 0 auto 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 12px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .top-nav a {
      text-decoration: none;
      color: #1e40af;
      background: #eff6ff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .top-nav a:hover { background: #1e40af; color: #fff; }
    .top-nav a.active { background: #1e40af; color: #fff; }

    .page-header {
      max-width: 1200px;
      margin: 0 auto 32px;
      text-align: center;
      padding: 32px 20px;
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      border-radius: 16px;
      color: #fff;
    }

    .page-header h1 { font-size: 26px; margin-bottom: 8px; }
    .page-header p { font-size: 15px; opacity: 0.9; }

    .intro {
      max-width: 1200px;
      margin: 0 auto 24px;
      padding: 0 8px;
      text-align: center;
      color: #475569;
      font-size: 15px;
    }

    .book-gallery {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 20px 0;
    }

    .book-gallery figure {
      margin: 0;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      /* این خط برای جلوگیری از رفتار پیش‌فرض گوشی اضافه شد */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .book-gallery figure:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .book-gallery img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      pointer-events: auto; /* اطمینان از دریافت کلیک */
    }

    .book-gallery figcaption {
      padding: 10px 12px;
      font-size: 13px;
      text-align: center;
      color: #374151;
      font-weight: 600;
    }

    /* استایل برای صفحه تمام صفحه */
    #fullscreen-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      z-index: 9999;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }

    #fullscreen-overlay img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    @media (max-width: 1024px) {
      .book-gallery { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .book-gallery { grid-template-columns: repeat(2, 1fr); }
      .page-header h1 { font-size: 20px; }
    }
    @media (max-width: 480px) {
      .book-gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="my-card.html">🏠 بازگشت به کارت ویزیت</a>
    <a href="books-sara-zare.html" class="active">📖 گالری تصاویر ۴</a>
  </nav>

  <header class="page-header">
    <h1>کتاب‌های خانم دکتر سارا زارع کاریزک</h1>
    <p>عضو هیئت علمی دانشگاه خلیج فارس</p>
  </header>

  <p class="intro">
    در این صفحه، گالری کتاب‌ها و آثار علمی خانم دکتر سارا زارع کاریزک، عضو هیئت علمی دانشگاه خلیج فارس، نمایش داده می‌شود. برای مشاهده اندازه کامل هر جلد، روی تصویر کلیک کنید.
  </p>

  <div class="book-gallery">

    <!-- کتاب ۱ -->
    <figure>
      <img src="https://raw.githubusercontent.com/parisa-zare/parisa-zare-siti/main/IMG_%DB%B2%DB%B0%DB%B2%DB%B6%DB%B1%DB%B0%DB%B3%DB%B1_%DB%B2%DB%B3%DB%B0%DB%B3%DB%B2%DB%B4.jpg" alt="کتاب ۱" class="gallery-img">
      <figcaption>کتاب ۱</figcaption>
    </figure>

    <!-- کتاب ۲ -->
    <figure>
      <img src="https://raw.githubusercontent.com/parisa-zare/parisa-zare-siti/main/IMG_%DB%B2%DB%B0%DB%B2%DB%B6%DB%B1%DB%B0%DB%B3%DB%B1_%DB%B2%DB%B3%DB%B0%DB%B2%DB%B5%DB%B7.jpg" alt="کتاب ۲" class="gallery-img">
      <figcaption>کتاب ۲</figcaption>
    </figure>

    <!-- کتاب ۳ -->
    <figure>
      <img src="https://raw.githubusercontent.com/parisa-zare/parisa-zare-siti/main/IMG_%DB%B2%DB%B0%DB%B2%DB%B6%DB%B1%DB%B0%DB%B3%DB%B1_%DB%B2%DB%B3%DB%B0%DB%B1%DB%B5%DB%B3.jpg" alt="کتاب ۳" class="gallery-img">
      <figcaption>کتاب ۳</figcaption>
    </figure>

    <!-- کتاب ۴ -->
    <figure>
      <img src="https://raw.githubusercontent.com/parisa-zare/parisa-zare-siti/main/IMG_%DB%B2%DB%B0%DB%B2%DB%B6%DB%B1%DB%B0%DB%B3%DB%B1_%DB%B2%DB%B3%DB%B0%DB%B2%DB%B2%DB%B5.jpg" alt="کتاب ۴" class="gallery-img">
      <figcaption>کتاب ۴</figcaption>
    </figure>

    <!-- کتاب ۵ -->
    <figure>
      <img src="https://raw.githubusercontent.com/parisa-zare/parisa-zare-siti/main/IMG_%DB%B2%DB%B0%DB%B2%DB%B6%DB%B1%DB%B0%DB%B3%DB%B1_%DB%B2%DB%B2%DB%B4%DB%B9%DB%B1%DB%B1.jpg" alt="کتاب ۵" class="gallery-img">
      <figcaption>کتاب ۵</figcaption>
    </figure>

    <!-- کتاب ۶ -->
    <figure>
      <img src="https://raw.githubusercontent.com/parisa-zare/parisa-zare-siti/main/IMG_%DB%B2%DB%B0%DB%B2%DB%B6%DB%B1%DB%B1%DB%B0%DB%B1_%DB%B1%DB%B6%DB%B4%DB%B2%DB%B2%DB%B9.jpg" alt="کتاب ۶" class="gallery-img">
      <figcaption>کتاب ۶ (علم تمرین)</figcaption>
    </figure>

  </div>

  <!-- کانتینر عکس تمام صفحه -->
  <div id="fullscreen-overlay">
    <img id="fullscreen-img" src="" alt="عکس بزرگ">
  </div>

  <!-- کد جاوااسکریپت -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var images = document.querySelectorAll('.gallery-img');
      var overlay = document.getElementById('fullscreen-overlay');
      var fullscreenImg = document.getElementById('fullscreen-img');

      images.forEach(function(img) {
        // استفاده از رویدادهای لمسی و کلیک برای پوشش همه دستگاه‌ها
        img.addEventListener('click', function(event) {
          event.preventDefault(); 
          event.stopPropagation();
          fullscreenImg.src = this.src;
          overlay.style.display = 'flex';
        });

        // برای گوشی‌ها که ممکن است با لمس (touch) رفتار متفاوتی داشته باشند
        img.addEventListener('touchstart', function(event) {
          event.preventDefault();
          fullscreenImg.src = this.src;
          overlay.style.display = 'flex';
        }, {passive: false});
      });

      overlay.addEventListener('click', function() {
        overlay.style.display = 'none';
        fullscreenImg.src = '';
      });
      
      overlay.addEventListener('touchstart', function(event) {
        event.preventDefault();
        overlay.style.display = 'none';
        fullscreenImg.src = '';
      }, {passive: false});
    });
  </script>

</body>
  </html>
