    * { box-sizing: border-box; margin: 0; padding: 0; }

      font-family: 'Vazirmatn', 'IRANSans', Tahoma, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      line-height: 1.7;
      padding: 20px;
    }

    .top-nav {
      max-width: 1200px;
      margin: 0 auto 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 12px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .top-nav a {
      text-decoration: none;
      color: #1e40af;
      background: #eff6ff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .top-nav a:hover { background: #1e40af; color: #fff; }
    .top-nav a.active { background: #1e40af; color: #fff; }

    .page-header {
      max-width: 1200px;
      margin: 0 auto 32px;
      text-align: center;
      padding: 32px 20px;
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      border-radius: 16px;
      color: #fff;
    }

    .page-header h1 { font-size: 26px; margin-bottom: 8px; }
    .page-header p { font-size: 15px; opacity: 0.9; }

    .book-gallery {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 20px 0;
    }

    .book-gallery figure {
      margin: 0;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .book-gallery figure:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .book-gallery img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .book-gallery figcaption {
      padding: 10px 12px;
      font-size: 13px;
      text-align: center;
      color: #374151;
      font-weight: 600;
    }

    .book-gallery a { text-decoration: none; }

    @media (max-width: 1024px) {
      .book-gallery { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .book-gallery { grid-template-columns: repeat(2, 1fr); }
      .page-header h1 { font-size: 20px; }
    }
    @media (max-width: 480px) {
      .book-gallery { grid-template-columns: 1fr; }
    }
  </style>
