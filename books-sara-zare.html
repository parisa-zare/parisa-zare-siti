<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>کتاب‌های دکتر سارا زارع کاریزک</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.7; padding: 20px; }
    .top-nav { max-width: 1200px; margin: 0 auto 24px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 12px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .top-nav a { text-decoration: none; color: #1e40af; background: #eff6ff; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; transition: all 0.2s; }
    .top-nav a:hover { background: #1e40af; color: #fff; }
    .top-nav a.active { background: #1e40af; color: #fff; }
    .page-header { max-width: 1200px; margin: 0 auto 32px; text-align: center; padding: 32px 20px; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); border-radius: 16px; color: #fff; }
    .page-header h1 { font-size: 26px; margin-bottom: 8px; }
    .page-header p { font-size: 15px; opacity: 0.9; }
    .intro { max-width: 1200px; margin: 0 auto 24px; padding: 0 8px; text-align: center; color: #475569; font-size: 15px; }
    .book-gallery { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px 0; }
    .book-gallery figure { margin: 0; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .book-gallery figure:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
    .book-gallery img { width: 100%; height: 260px; object-fit: cover; display: block; cursor: pointer; }
    .book-gallery figcaption { padding: 10px 12px; font-size: 13px; text-align: center; color: #374151; font-weight: 600; }
    @media (max-width: 1024px) { .book-gallery { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .book-gallery { grid-template-columns: repeat(2, 1fr); } .page-header h1 { font-size: 20px; } }
    @media (max-width: 480px) { .book-gallery { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="my-card.html">🏠 بازگشت به کارت ویزیت</a>
    <a href="books-sara-zare.html" class="active">📖 گالری تصاویر ۴</a>
  </nav>

  <header class="page-header">

  </header>

  <p class="intro">
    در این صفحه، گالری کتاب‌ها و آثار علمی خانم دکتر سارا زارع کاریزک، عضو هیئت علمی دانشگاه خلیج فارس، نمایش داده می‌شود. برای مشاهده اندازه کامل هر جلد، روی تصویر کلیک کنید.
  </p>

  <div class="book-gallery">

    <!-- لینک عکس‌ها را از سایت میزبانی عکس جایگزین کنید -->
    
    <figure>
      <img src="لینک-عکس-اول.jpg" alt="کتاب ۱" onclick="window.open(this.src, '_blank')">

    </figure>

    <figure>

    <figure>
      <img src="لینک-عکس-سوم.jpg" alt="کتاب ۳" onclick="window.open(this.src, '_blank')">
      <figcaption>کتاب ۳</figcaption>
    </figure>

    <figure>
      <img src="لینک-عکس-چهارم.jpg" alt="کتاب ۴" onclick="window.open(this.src, '_blank')">
      <figcaption>کتاب ۴</figcaption>
    </figure>

    <figure>

      <figcaption>کتاب ۵</figcaption>

    <figure>

    </figure>

  </div>

</body>
</html>
