<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="کارت ویزیت و بنر اختصاصی پریسا زارع کاریزک، وکیل پایه یک دادگستری در مشهد. مشاوره حقوقی، تنظیم قراردادها و پیگیری پرونده‌ها.">
<title>پریسا زارع کاریزک | کارت ویزیت وکیل پایه یک دادگستری</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: Tahoma, Arial, sans-serif;
        background-color: #1a110a; /* رنگ پس‌زمینه شبیه میز چوبی */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    .card-container {
        max-width: 600px;
        width: 100%;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        border-radius: 16px;
        overflow: hidden;
        background: #f8f1e0;
        border: 2px solid #d5ad5b; /* حاشیه طلایی */
    }
    .card-container img {
        width: 100%;
        height: auto;
        display: block;
    }
    .btn-back {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 30px;
        background-color: #d5ad5b;
        color: #101d35;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .btn-back:hover {
        background-color: #f5ebd3;
        transform: translateY(-2px);
    }
</style>
</head>
<body>

    <div class="card-container">
        <!-- لینک دقیق عکس شما -->
        <img src="https://i.postimg.cc/prYNMzYn/IMG-20261022-123032-702.jpg" alt="کارت ویزیت پریسا زارع کاریزک، وکیل پایه یک دادگستری">
    </div>

    <a href="/parisa-zare-siti/" class="btn-back">بازگشت به سایت اصلی</a>

</body>
</html>
