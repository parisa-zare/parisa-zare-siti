<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت ویزیت پریسا زارع کاریزک | وکیل پایه یک دادگستری</title>
    <meta name="description" content="کارت ویزیت دیجیتال پریسا زارع کاریزک، وکیل پایه یک دادگستری در مشهد. مشاوره حقوقی، تنظیم قراردادها و پیگیری پرونده‌ها.">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1a110a 0%, #2c1e16 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .card-container {
            max-width: 600px; width: 100%;
            background: #f8f1e0;
            border-radius: 20px;
            border: 2px solid #d5ad5b;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            padding: 40px 30px;
            position: relative; overflow: hidden;
        }
        .card-container::before {
            content: ""; position: absolute; top: -50px; right: -50px;
            width: 150px; height: 150px; border-radius: 50%;
            background: radial-gradient(circle, rgba(213,173,91,0.2) 0%, transparent 70%);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header .icon-scale { width: 70px; height: 70px; fill: #d5ad5b; margin-bottom: 15px; }
        .header h1 { font-size: 36px; font-weight: 900; color: #101d35; margin-bottom: 5px; }
        .header .title { font-size: 18px; font-weight: 700; color: #d5ad5b; letter-spacing: 1px; }
        
        .tagline { text-align: center; font-size: 16px; color: #4a5a73; line-height: 1.8; margin-bottom: 30px; font-weight: 500; }

        /* کادر سرمه‌ای کانون وکلا */
        .association-box {
            background: #101d35; /* رنگ سرمه‌ای */
            color: #d5ad5b; /* رنگ طلایی */
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 35px;
            border: 1px solid #d5ad5b;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }

        .services { margin-bottom: 40px; }
        .services h3 { font-size: 18px; color: #101d35; margin-bottom: 15px; border-right: 4px solid #d5ad5b; padding-right: 10px; }
        .services ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .services li { display: flex; align-items: center; font-size: 15px; color: #101d35; font-weight: 700; }
        .services li svg { width: 20px; height: 20px; fill: #d5ad5b; margin-left: 10px; flex-shrink: 0; }

        .footer {
            border-top: 1px solid #e5dcc8; padding-top: 20px;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .footer .slogan { font-size: 15px; font-weight: 700; color: #101d35; font-style: italic; }
        .footer .logo-text { font-family: 'Times New Roman', serif; font-size: 16px; color: #d5ad5b; letter-spacing: 2px; font-weight: bold; }

        .btn-back {
            display: inline-block; margin-top: 25px; padding: 12px 30px;
            background-color: #d5ad5b; color: #101d35;
            text-decoration: none; border-radius: 8px;
            font-weight: bold; font-size: 16px; transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-back:hover { background-color: #f5ebd3; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="header">
            <svg class="icon-scale" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 15 L50 80 M30 40 L70 40 M50 80 L40 90 M50 80 L60 90" stroke="#d5ad5b" stroke-width="3" fill="none" stroke-linecap="round"/>
                <circle cx="50" cy="15" r="4" fill="#d5ad5b"/>
                <path d="M20 40 L35 60 L5 60 Z" fill="none" stroke="#d5ad5b" stroke-width="2"/>
                <path d="M80 40 L65 60 L95 60 Z" fill="none" stroke="#d5ad5b" stroke-width="2"/>
            </svg>
            <h1>پریسا زارع کاریزک</h1>
            <p class="title">وکیل پایه یک دادگستری</p>
        </div>

        <p class="tagline">با تعهد، دانش و تجربه<br>در کنار شما هستم</p>

        <!-- کادر کانون وکلا -->
        <div class="association-box">
            کانون وکلای خراسان
        </div>

        <div class="services">
            <h3>حوزه‌های تخصصی</h3>
            <ul>
                <li><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg> مشاوره حقوقی</li>
                <li><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> تنظیم قراردادها</li>
                <li><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> پیگیری پرونده‌ها</li>
                <li><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg> دعاوی حقوقی و کیفری</li>
            </ul>
        </div>

        <div class="footer">
            <span class="slogan">حق شما،<br>اولویت ماست...</span>
            <span class="logo-text">PARISA ZARE</span>
        </div>
    </div>
    <a href="/parisa-zare-siti/" class="btn-back">بازگشت به سایت اصلی</a>
</body>
</html>
