<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت ویزیت دیجیتال - پریسا زارع</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: #f8f5ec; color: #1a2238; text-align: center;
            display: flex; flex-direction: column; min-height: 100vh;
            justify-content: center;
        }

        .card-container {
            background-color: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 40px 20px;
            max-width: 450px;
            margin: 20px auto;
            width: 90%;
        }

        .profile-title {
            font-size: 28px;
            font-weight: bold;
            color: #1a2238;
            margin-bottom: 5px;
        }

        .profile-subtitle {
            font-size: 16px;
            color: #d4af37;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            border-radius: 10px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        /* دکمه‌ها */
        .btn-primary { background-color: #1a2238; color: #d4af37; border: 2px solid #d4af37; }
        .btn-secondary { background-color: #ffffff; color: #1a2238; border: 2px solid #1a2238; }
        
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }

        /* بخش تماس */
        .contact-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
            font-size: 15px;
            line-height: 2;
        }
        .contact-info a { color: #1a2238; text-decoration: none; font-weight: bold; }

        .btn-back-home {
            margin-top: 20px;
            background-color: transparent;
            color: #666;
            border: none;
            font-size: 14px;
            text-decoration: underline;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="profile-title">پریسا زارع</div>
        <div class="profile-subtitle">وکیل پایه یک دادگستری</div>

        <div class="menu-links">
            <!-- لینک‌ها به فایل‌های موجود در ریشه اصلی -->
            <a href="./gallery.html" class="btn btn-primary">گالری تصاویر ۱</a>
            <a href="./gallery2.html" class="btn btn-primary">گالری تصاویر ۲</a>
            <a href="./gallery3.html" class="btn btn-primary">گالری تصاویر ۳</a>
            <a href="./books-sara-zare.html" class="btn btn-primary">گالری تصاویر ۴ - کتاب‌های دکتر سارا زارع کاریزک</a>
            <a href="./billboard.html" class="btn btn-secondary">بیلبورد تبلیغاتی</a>
        </div>

        <div class="contact-info">
            <div>📞 تماس: <a href="tel:09151069266">۰۹۱۵۱۰۶۹۲۶۶</a></div>
            <div>📍 نشانی: مشهد، احمدآباد، ملاصدرا</div>
        </div>

        <a href="./index.html" class="btn btn-back-home">بازگشت به صفحه اصلی سایت</a>
    </div>

</body>
</html>
