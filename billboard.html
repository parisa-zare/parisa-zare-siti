<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بیلبورد تبلیغاتی - پریسا زارع کاریزک</title>
    
    <!-- فونت فارسی وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            margin: 0; 
            padding: 0; 
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: #f8f5ec; 
            color: #1a2238; 
            text-align: center;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }
        
        header { 
            background-color: #1a2238; 
            color: #d4af37; 
            padding: 35px 20px; 
        }
        
        header h1 { 
            margin: 0; 
            font-size: 28px; 
            font-weight: bold;
        }
        
        header p { 
            margin-top: 10px; 
            margin-bottom: 0; 
            font-size: 16px; 
            color: #ffffff; 
        }
        
        .main-content { 
            flex: 1; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .main-content h2 { 
            font-size: 26px; 
            margin-bottom: 30px; 
            margin-top: 0; 
            font-weight: bold;
        }
        
        .album-card {
            display: block; 
            background-color: #ffffff; 
            border: 2px solid #d4af37;
            border-radius: 15px; 
            padding: 20px; 
            width: 100%; 
            max-width: 500px;
            text-decoration: none; 
            color: #1a2238; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            box-sizing: border-box; 
            margin-bottom: 30px;
        }
        
        .album-card img {
            width: 100%; 
            height: auto; 
            border-radius: 10px; 
            display: block; 
            margin-bottom: 20px; 
            background-color: #f0f0f0;
        }
        
        .album-text-small { 
            font-size: 16px; 
            color: #666666; 
            margin-bottom: 10px; 
            text-align: right; 
        }
        
        .album-text-large { 
            font-size: 24px; 
            font-weight: bold; 
            color: #1a2238; 
            text-align: right; 
        }
        
        .btn-back {
            background-color: #1a2238; 
            color: #d4af37; 
            text-decoration: none;
            padding: 14px 45px; 
            border-radius: 8px; 
            font-size: 18px;
            font-weight: bold; 
            display: inline-block; 
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }
        
        .btn-back:hover {
            background-color: #2a3452;
        }
        
        footer { 
            background-color: #1a2238; 
            color: #ffffff; 
            padding: 20px; 
            font-size: 15px; 
        }
    </style>
</head>
<body>

    <header>
        <h1>پریسا زارع کاریزک</h1>
        <p>لحظه‌ها و تصاویر منتخب</p>
    </header>

    <div class="main-content">
        <h2>بیلبورد تبلیغاتی</h2>

        <!-- کارت نمایش عکس بیلبورد -->
        <a href="https://raw.githubusercontent.com/parisa-zare/parisa-zare-siti/main/IMG_%DB%B2%DB%B0%DB%B2%DB%B0%DB%B2%DB%B0%DB%B1%DB%B0_%DB%B1%DB%B6%DB%B4%DB%B4%DB%B4%DB%B5%DB%B5%DB%B0.jpg" class="album-card">
            
            <img src="https://raw.githubusercontent.com/parisa-zare/parisa-zare-siti/main/IMG_%DB%B2%DB%B0%DB%B2%DB%B0%DB%B2%DB%B0%DB%B1%DB%B0_%DB%B1%DB%B6%DB%B4%DB%B4%DB%B4%DB%B5%DB%B5%DB%B0.jpg" alt="عکس بیلبورد دفتر وکالت">
            
            <div class="album-text-small">طرح تبلیغاتی محیطی</div>
            <div class="album-text-large">بیلبورد دفتر وکالت پریسا زارع</div>
            
        </a>

        <a href="./index.html" class="btn-back">بازگشت به صفحه اصلی</a>
    </div>

    <footer>
        تمامی حقوق این وب‌سایت متعلق به پریسا زارع کاریزک است.
    </footer>

</body>
  </html>
