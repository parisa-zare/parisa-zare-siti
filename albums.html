<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="آلبوم تصاویر پریسا زارع کاریزک">
  <title>آلبوم تصاویر | پریسا زارع کاریزک</title>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Vazirmatn', sans-serif;
      background: #f8f5ed;
      color: #101d35;
    }

    header {
      background: #101d35;
      color: #d5ad5b;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      color: #f8f5ed;
      margin: 12px 0 0;
      font-size: 15px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 18px;
      text-align: center;
    }

    .album-title {
      font-size: 25px;
      margin-bottom: 28px;
      color: #101d35;
    }

    .photo-card {
      background: white;
      padding: 18px;
      border: 2px solid #d5ad5b;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(16, 29, 53, 0.10);
    }

    .photo-card img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 750px;
      object-fit: contain;
      border-radius: 12px;
    }

    .photo-caption {
      color: #101d35;
      font-size: 19px;
      font-weight: 700;
      margin: 20px 0 8px;
    }

    .image-error {
      display: none;
      color: #a33;
      background: #fff4f4;
      padding: 20px;
      border-radius: 10px;
      line-height: 2;
    }

    .back-button {
      display: inline-block;
      margin: 30px 0;
      padding: 14px 30px;
      background: #101d35;
      color: #d5ad5b;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
    }

    .back-button:hover {
      background: #243b60;
    }

    footer {
      background: #101d35;
      color: #f8f5ed;
      text-align: center;
      padding: 22px 12px;
      font-size: 14px;
      line-height: 2;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      .album-title {
        font-size: 21px;
      }

      main {
        margin-top: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>پریسا زارع کاریزک</h1>
    <p>لحظه‌ها و تصاویر منتخب</p>
  </header>

  <main>
    <h2 class="album-title">آلبوم تصاویر</h2>

    <div class="photo-card">

      <img
        src="./IMG_20261031_12301.jpg"
        alt="عکس شماره یک آلبوم"
        onerror="this.style.display='none'; document.getElementById('imageError').style.display='block';"
      >

      <div id="imageError" class="image-error">
        تصویر هنوز بارگذاری نشده است.
        لطفاً نام و محل فایل عکس را در مخزن GitHub بررسی کنید.
      </div>

      <div class="photo-caption">
        آلبوم شماره یک
      </div>

    </div>

    <a class="back-button" href="./home-6.html">
      بازگشت به صفحه اصلی
    </a>
  </main>

  <footer>
    تمامی حقوق این وب‌سایت متعلق به پریسا زارع کاریزک است.
  </footer>

</body>
</html>
