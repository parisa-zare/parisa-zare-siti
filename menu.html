<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی تصاویر - پریسا زارع</title>
    
    <!-- فونت فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            margin: 0; 
            padding: 0; 
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: #f8f5ec; 
            color: #1a2238; 
            text-align: center;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 20px;
            border-radius: 15px;
            border: 2px solid #d4af37;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 20px auto;
            width: 90%;
        }

        h2 { 
            color: #1a2238; 
            font-size: 26px; 
            margin-bottom: 30px; 
            margin-top: 0;
        }

        .btn {
            display: block; 
            width: 100%; 
            box-sizing: border-box;
            margin-bottom: 15px; 
            padding: 15px;
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px;
            border-radius: 10px; 
            transition: 0.3s;
        }

        .btn-gallery { 
            background-color: #1a2238; 
            color: #d4af37; 
            border: 2px solid #d4af37; 
        }

        .btn-billboard { 
            background-color: #ffffff; 
            color: #1a2238; 
            border: 2px solid #1a2238; 
        }

        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-back-home {
            background-color: transparent; 
            color: #666; 
            border: none;
            font-size: 14px; 
            margin-top: 20px; 
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>به بخش تصاویر خوش آمدید</h2>
        
        <a href="./gallery.html" class="btn btn-gallery">مشاهده گالری تصاویر</a>
        <a href="./billboard.html" class="btn btn-billboard">مشاهده بیلبورد تبلیغاتی</a>
        
        <a href="./index.html" class="btn btn-back-home">بازگشت به صفحه اصلی سایت</a>
    </div>

</body>
      </html>
