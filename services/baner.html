<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بنر - پریسا زارع کاریزک</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f8f5ed;color:#17243a;line-height:2}
.banner{background:linear-gradient(160deg,#fdfaf2 0%,#f8f1e0 30%,#f5ebd3 70%,#f0e2c0 100%);padding:0;text-align:center;position:relative;overflow:hidden;border-bottom:4px double #d5ad5b}
.banner-decoration-top{position:absolute;top:0;right:0;left:0;height:5px;background:linear-gradient(90deg,#d5ad5b 0%,#a27a2f 50%,#d5ad5b 100%)}
.banner-decoration-bottom{position:absolute;bottom:0;right:0;left:0;height:3px;background:linear-gradient(90deg,transparent,#d5ad5b,transparent)}
.banner-inner{position:relative;z-index:1;max-width:750px;margin:auto;padding:45px 8% 40px}
.banner-logo{margin-bottom:18px}
.banner-divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px auto;max-width:400px}
.banner-divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#d5ad5b,transparent)}
.banner-divider .diamond{color:#d5ad5b;font-size:12px;letter-spacing:2px}
.banner-divider.small{max-width:200px;margin:12px auto}
.banner-divider .diamond.small{font-size:8px}
.banner-name{font-size:42px;color:#101d35;margin:12px 0 8px;font-weight:bold;letter-spacing:1px;line-height:1.3}
.banner-title{font-size:19px;color:#a27a2f;margin:0;font-weight:bold;letter-spacing:2px}
.banner-slogan{font-size:16px;color:#4a5a73;margin:14px 0 0;font-style:italic;letter-spacing:0.5px;line-height:1.8}
@media(max-width:600px){
  .banner-inner{padding:30px 6% 28px}
  .banner-name{font-size:26px;letter-spacing:0.5px}
  .banner-title{font-size:14px;letter-spacing:1px}
  .banner-slogan{font-size:13px}
}
</style>
</head>
<body>

<div class="banner">
  <div class="banner-decoration-top"></div>
  <div class="banner-inner">
    <div class="banner-logo">
      <svg viewBox="0 0 120 120" width="80" height="80">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#d5ad5b"/>
            <stop offset="100%" style="stop-color:#a27a2f"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="52" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
        <circle cx="60" cy="60" r="48" fill="none" stroke="#d5ad5b" stroke-width="0.5" stroke-dasharray="2,4"/>
        <path d="M60 25 L60 95" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M38 42 L82 42" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M48 42 L48 55" stroke="#d5ad5b" stroke-width="1.5"/>
        <path d="M72 42 L72 55" stroke="#d5ad5b" stroke-width="1.5"/>
        <circle cx="48" cy="58" r="4" fill="none" stroke="#d5ad5b" stroke-width="1.5"/>
        <circle cx="72" cy="58" r="4" fill="none" stroke="#d5ad5b" stroke-width="1.5"/>
        <path d="M45 80 L75 80" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M45 86 L75 86" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="banner-divider">
      <span class="line"></span>
      <span class="diamond">◆</span>
      <span class="line"></span>
    </div>
    <h1 class="banner-name">پریسا زارع کاریزک</h1>
    <p class="banner-title">وکیل پایه یک دادگستری</p>
    <div class="banner-divider small">
      <span class="line"></span>
      <span class="diamond small">◆</span>
      <span class="line"></span>
    </div>
    <p class="banner-slogan">در مسیر احقاق حق تنها قدم برندارید</p>
  </div>
  <div class="banner-decoration-bottom"></div>
</div>

</body>
          </html>
